name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm install
      - name: syntax
        run: for f in $(find js tests -name '*.js'); do node --check "$f" || exit 1; done
      - name: format
        run: npm run check
      - name: tests
        run: npm test
